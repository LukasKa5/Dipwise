name = "dipwise-quotes"
main = "worker.js"
compatibility_date = "2026-10-01"

# Checks every device's price alerts once a minute and pushes the moment one is reached.
[triggers]
crons = ["* * * * *"]

# Each device's push token and price-level alerts. Create it once with:
#   npx wrangler kv namespace create DEVICES
# and paste the id it prints here.
[[kv_namespaces]]
binding = "DEVICES"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
BUNDLE_ID = "REPLACE_WITH_APP_BUNDLE_ID"

# Secrets, never in this file:
#   npx wrangler secret put TWELVE_DATA_KEY
#   npx wrangler secret put APNS_KEY        (the .p8 file's contents)
#   npx wrangler secret put APNS_KEY_ID
#   npx wrangler secret put APNS_TEAM_ID
